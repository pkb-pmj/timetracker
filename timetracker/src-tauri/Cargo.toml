[package]
name = "timetracker"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "timetracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-vnidrop-fs = "1.0.0-rc.2"
toml = "1.1.6"
thiserror = "2.0.20"
tauri-plugin-store = "2"
sqlx = { version = "0.9.0", features = ["macros", "migrate", "runtime-tokio", "sqlite", "uuid"] , default-features = false}
uuid = { version = "1.26.1", features = ["v7"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# make sqlx macros faster
# https://github.com/transact-rs/sqlx/blob/main/README.md#compile-time-verification
[profile.dev.package.sqlx-macros]
opt-level = 3
